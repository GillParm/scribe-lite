name: scribe-lite

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: scribe
      POSTGRES_PASSWORD: scribe
      POSTGRES_DB: scribe
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scribe -d scribe"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
